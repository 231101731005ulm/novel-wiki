<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Persona Card</title>

    <link rel="stylesheet" href="Color.css">

</head>
<body>

    <body>

<div class="persona-card">

    <div class="top">

        <img src="Persona.jpg" class="portrait">

        <div class="info">

            <div class="quote">
                I am Rhadamanthus...
            </div>

            <div class="grid">

                <div class="cell">
                    <span>Arcana</span>
                    <b>Death</b>
                </div>

                <div class="cell">
                    <span>Type</span>
                    <b>None</b>
                </div>

                <div class="cell">
                    <span>Level</span>
                    <b>1</b>
                </div>

                <div class="cell">
                    <span>SP Cost</span>
                    <b>5</b>
                </div>

                <div class="cell">
                    <span>Bonus</span>
                    <b>ST +1</b>
                </div>

            </div>

        </div>

    </div>

    <table class="stats">
        <tr>
            <th>Atk</th>
            <th>Def</th>
            <th>Matk</th>
            <th>Mdef</th>
        </tr>

        <tr>
            <td>8</td>
            <td>10</td>
            <td>6</td>
            <td>9</td>
        </tr>
    </table>

</div>

</body>

</body>
</html>
